name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Lint and style check with Ruff
        run: |
          ruff check src tests

      - name: Type check with Mypy
        run: |
          mypy src tests/test_api.py

      - name: Run Python test suite with Pytest
        run: |
          pytest

  frontend-quality:
    name: Frontend (Vitest & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest unit & component tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build production bundle
        run: |
          cd frontend
          npm run build
