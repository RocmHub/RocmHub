<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="empty-box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a35" />
      <stop offset="100%" stop-color="#1f1f26" />
    </linearGradient>
    <linearGradient id="empty-box-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22222b" />
      <stop offset="100%" stop-color="#16161c" />
    </linearGradient>
    <linearGradient id="empty-box-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1b22" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <radialGradient id="empty-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ED1C24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ED1C24" stop-opacity="0" />
    </radialGradient>
    <filter id="empty-blur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Ambient Floor Glow -->
  <ellipse cx="200" cy="220" rx="120" ry="35" fill="url(#empty-glow)" filter="url(#empty-blur)" />

  <!-- Base Grid Plinth -->
  <g stroke="#2E2E38" stroke-width="0.75" fill="none" opacity="0.6">
    <polygon points="200,160 300,215 200,270 100,215" />
    <polygon points="200,175 280,219 200,263 120,219" />
  </g>

  <!-- Isometric Server / Accelerator Module Standby Block -->
  <!-- Bottom block -->
  <g transform="translate(0, 10)">
    <!-- Left face -->
    <polygon points="140,165 200,198 200,225 140,192" fill="url(#empty-box-left)" stroke="#2E2E38" stroke-width="1" />
    <!-- Right face -->
    <polygon points="200,198 260,165 260,192 200,225" fill="url(#empty-box-right)" stroke="#2E2E38" stroke-width="1" />
    <!-- Top face -->
    <polygon points="200,132 260,165 200,198 140,165" fill="url(#empty-box-top)" stroke="#3a3a46" stroke-width="1" />
  </g>

  <!-- Floating Upper Micro-Module (Standby Idle) -->
  <g transform="translate(0, -20)">
    <!-- Left face -->
    <polygon points="150,110 200,138 200,162 150,134" fill="url(#empty-box-left)" stroke="#3a3a46" stroke-width="1" />
    <!-- Right face -->
    <polygon points="200,138 250,110 250,134 200,162" fill="url(#empty-box-right)" stroke="#2E2E38" stroke-width="1" />
    <!-- Top face with circuit lines -->
    <polygon points="200,82 250,110 200,138 150,110" fill="url(#empty-box-top)" stroke="#4a4a56" stroke-width="1" />

    <!-- Pulsing Telemetry Dot on Top -->
    <circle cx="200" cy="110" r="4" fill="#ED1C24" />
    <circle cx="200" cy="110" r="8" fill="none" stroke="#ED1C24" stroke-width="1" opacity="0.6" stroke-dasharray="2,2" />
  </g>

  <!-- Subtle Dashed Alignment Rays -->
  <line x1="200" y1="40" x2="200" y2="75" stroke="#ED1C24" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
  <line x1="120" y1="120" x2="145" y2="135" stroke="#71717A" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />
  <line x1="280" y1="120" x2="255" y2="135" stroke="#71717A" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />
</svg>
