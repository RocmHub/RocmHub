<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="opt-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1c1619" />
      <stop offset="45%" stop-color="#131317" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </radialGradient>

    <!-- Filters -->
    <filter id="crimson-glow-opt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="green-glow-opt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="gradient-baseline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717A" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <linearGradient id="gradient-candidate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ED1C24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="opt-card-surf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212128" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#16161c" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="675" fill="url(#opt-bg)" />

  <!-- Scientific Oscilloscope / Telemetry Grid -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="0.75">
    <line x1="100" y1="120" x2="1100" y2="120" />
    <line x1="100" y1="220" x2="1100" y2="220" />
    <line x1="100" y1="320" x2="1100" y2="320" />
    <line x1="100" y1="420" x2="1100" y2="420" />
    <line x1="100" y1="520" x2="1100" y2="520" />

    <line x1="100" y1="120" x2="100" y2="520" />
    <line x1="350" y1="120" x2="350" y2="520" />
    <line x1="600" y1="120" x2="600" y2="520" />
    <line x1="850" y1="120" x2="850" y2="520" />
    <line x1="1100" y1="120" x2="1100" y2="520" />
  </g>

  <!-- Precision Tuning Dyno Curves -->
  <!-- Baseline Curve (Reference) -->
  <path d="M120,440 C 250,420 380,390 500,370 C 650,350 800,330 950,320 C 1020,315 1060,310 1080,310" 
        fill="none" stroke="url(#gradient-baseline)" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Candidate Strategy Curves (Accelerated) -->
  <path d="M120,420 C 250,380 380,300 500,260 C 650,210 800,180 950,165 C 1020,160 1060,155 1080,155" 
        fill="none" stroke="url(#gradient-candidate)" stroke-width="3" filter="url(#crimson-glow-opt)" opacity="0.9" />

  <!-- Area Under Candidate Curve (Subtle Glow Fill) -->
  <path d="M120,420 C 250,380 380,300 500,260 C 650,210 800,180 950,165 C 1020,160 1060,155 1080,155 L1080,520 L120,520 Z" 
        fill="url(#gradient-candidate)" opacity="0.04" />

  <!-- Key Measurement Markers Along Curve -->
  <!-- Measurement Point 1: Baseline TTFT -->
  <circle cx="500" cy="370" r="5" fill="#A1A1AA" />
  <line x1="500" y1="370" x2="500" y2="520" stroke="#A1A1AA" stroke-width="1" stroke-dasharray="2,4" opacity="0.4" />

  <!-- Measurement Point 2: Optimized Candidate TTFT -->
  <circle cx="500" cy="260" r="7" fill="#ED1C24" filter="url(#crimson-glow-opt)" />
  <circle cx="500" cy="260" r="2.5" fill="#FFFFFF" />
  <line x1="500" y1="260" x2="500" y2="370" stroke="#ED1C24" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Comparative Delta Callout -->
  <g transform="translate(460, 200)">
    <rect width="80" height="24" rx="4" fill="#ED1C24" opacity="0.9" />
    <text x="40" y="16" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">&#x0394; SPEEDUP</text>
  </g>

  <!-- Left Comparison Card (Baseline) -->
  <g transform="translate(140, 200)">
    <rect width="220" height="110" rx="8" fill="url(#opt-card-surf)" stroke="#2E2E38" stroke-width="1" />
    <rect width="4" height="110" rx="2" fill="#71717A" />
    <text x="18" y="28" fill="#A1A1AA" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">BASELINE</text>
    <text x="18" y="50" fill="#F5F5F7" font-family="monospace" font-size="13" font-weight="600">PyTorch FP16</text>
    <text x="18" y="72" fill="#A1A1AA" font-family="monospace" font-size="10">Standard Attention</text>
    <text x="18" y="92" fill="#71717A" font-family="monospace" font-size="9">Status: Reference Policy</text>
  </g>

  <!-- Right Comparison Card (Candidate Winner) -->
  <g transform="translate(840, 360)">
    <rect width="240" height="110" rx="8" fill="url(#opt-card-surf)" stroke="#ED1C24" stroke-width="1" />
    <rect width="4" height="110" rx="2" fill="#ED1C24" />
    <text x="18" y="28" fill="#ED1C24" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">CANDIDATE 1 // ACTIVE</text>
    <text x="18" y="50" fill="#F5F5F7" font-family="monospace" font-size="13" font-weight="600">BF16 + FlashAttention</text>
    <text x="18" y="72" fill="#A1A1AA" font-family="monospace" font-size="10">Kernel: gfx1100 / gfx942</text>
    <text x="18" y="92" fill="#10B981" font-family="monospace" font-size="9">&#x2713; Zero Quality Regression</text>
  </g>

  <!-- Bottom Technical Coordinate Badge -->
  <g transform="translate(430, 610)" opacity="0.8">
    <rect width="340" height="28" rx="14" fill="#17171d" stroke="#2E2E38" stroke-width="1" />
    <circle cx="450" cy="624" r="4" fill="#ED1C24" />
    <text x="465" y="628" fill="#A1A1AA" font-family="monospace" font-size="10" letter-spacing="1">OPTIMIZATION DYNO // CANDIDATE EVAL</text>
  </g>
</svg>
