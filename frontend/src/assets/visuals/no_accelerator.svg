<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a241a" />
      <stop offset="100%" stop-color="#191612" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="100" fill="url(#amber-glow)" />

  <!-- Technical Circuit Board Boundary -->
  <rect x="80" y="50" width="240" height="200" rx="12" fill="#141419" stroke="#2E2E38" stroke-width="1.5" />
  
  <!-- Corner Mount Holes -->
  <circle cx="100" cy="70" r="5" fill="#1e1e26" stroke="#3A3A48" stroke-width="1" />
  <circle cx="300" cy="70" r="5" fill="#1e1e26" stroke="#3A3A48" stroke-width="1" />
  <circle cx="100" cy="230" r="5" fill="#1e1e26" stroke="#3A3A48" stroke-width="1" />
  <circle cx="300" cy="230" r="5" fill="#1e1e26" stroke="#3A3A48" stroke-width="1" />

  <!-- Socket Perimeter Lines -->
  <rect x="130" y="90" width="140" height="120" rx="8" fill="url(#shield-grad)" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,4" opacity="0.8" />

  <!-- Central Shield with Alert Symbol -->
  <path d="M200,105 L235,120 L235,160 C235,185 200,200 200,200 C200,200 165,185 165,160 L165,120 Z" 
        fill="#231c13" stroke="#F59E0B" stroke-width="1.5" />

  <!-- Exclamation in Shield -->
  <line x1="200" y1="125" x2="200" y2="155" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="200" cy="172" r="2" fill="#F59E0B" />

  <!-- Diagnostic Circuit Leads -->
  <line x1="130" y1="150" x2="100" y2="150" stroke="#4B4B58" stroke-width="1.5" />
  <line x1="270" y1="150" x2="300" y2="150" stroke="#4B4B58" stroke-width="1.5" />
  <line x1="200" y1="90" x2="200" y2="70" stroke="#4B4B58" stroke-width="1.5" />
  <line x1="200" y1="210" x2="200" y2="230" stroke="#4B4B58" stroke-width="1.5" />

  <!-- Text Label -->
  <text x="200" y="275" fill="#A1A1AA" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="1">CONFIG_ONLY // SAFE FALLBACK</text>
</svg>
